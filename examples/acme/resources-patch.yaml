# Starting budgets, not measured capacity. Size these for the customer's workload.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onify-api
spec:
  template:
    spec:
      containers:
        - name: onify-api
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onify-worker
spec:
  template:
    spec:
      containers:
        - name: onify-worker
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onify-app
spec:
  template:
    spec:
      containers:
        - name: onify-app
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onify-gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onify-elasticsearch
spec:
  template:
    spec:
      containers:
        - name: onify-elasticsearch
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
