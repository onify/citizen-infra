# Starting budgets, not measured capacity. Size these for the customer's workload.
# CPU limits are omitted to allow bursts; add them if the cluster requires them.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onify-api
spec:
  template:
    spec:
      containers:
        - name: onify-api
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              memory: 4Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onify-worker
spec:
  template:
    spec:
      containers:
        - name: onify-worker
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              memory: 4Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onify-app
spec:
  template:
    spec:
      containers:
        - name: onify-app
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onify-gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onify-elasticsearch
spec:
  template:
    spec:
      containers:
        - name: onify-elasticsearch
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              memory: 4Gi
